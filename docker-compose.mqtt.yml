x-node-service: &node-service
  build: .
  restart: on-failure
  depends_on:
    mosquitto:
      condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *node-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MESSAGING_DRIVER: mqtt
      MQTT_URL: mqtt://mosquitto:1883

  entregador:
    <<: *node-service
    command: node dist/mqtt/entregador.js
    environment:
      MQTT_URL: mqtt://mosquitto:1883
